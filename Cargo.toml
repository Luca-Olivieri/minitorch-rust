[package]
name = "minitorch-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "minitorch_rust"
path = "src/lib.rs"

[[bin]]
name = "xor"
path = "main/xor.rs"

[[bin]]
name = "covertype"
path = "main/covertype.rs"

[[bin]]
name = "mnist"
path = "main/mnist.rs"

[features]
default = []
allow_lossy_casts = []
allow_dangerous_casts = []

[dependencies]
fmt = "0.1.0"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
